let toastT;
function toast(m){const el=$('toast');el.textContent=m;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,2000)}
const spend=c=>{if(S.coins<c){toast(t('poor'));return false}S.coins-=c;return true};
function near(){
  if(driving)return{t:'d'};const x=P.position.x,z=P.position.z;let best=null,bd=2.6;if(Math.hypot(x-TR.position.x,z-TR.position.z)<3)return{t:'t'};
  for(let i=0;i<S.plots.length;i++){const d=Math.hypot(x-PP[i].x,z-PP[i].z);if(d<bd){bd=d;best={t:'p',i}}}
  if(best)return best;
  if(Math.hypot(x,z+18)<7.5)return{t:'w'};
  if(Math.abs(x-29)<12.5&&z>-4&&z<5.5)return{t:'m'};
  if(Math.hypot(x-CF.x,z-CF.z)<6)return{t:'c'};
  if(Math.hypot(x-HF.x,z-HF.z)<5)return{t:'h'};
  if(Math.hypot(x-FF.x,z-FF.z)<5.5)return{t:'f'};
  return null;
}
function act(){
  if(!started||!$('mk').classList.contains('hidden'))return;
  const n=near();if(!n)return;
  if(n.t==='t'){driving=true;tgt=null;P.position.set(TR.position.x,0,TR.position.z);P.rotation.y=TR.rotation.y;P.visible=false}
  else if(n.t==='d'){driving=false;P.visible=true;P.position.x+=2.4}
  else if(n.t==='c'){if(!S.fedAt){if(S.hay<S.cows)toast(t('noHay'));else{S.hay-=S.cows;S.fedAt=Date.now();toast(t('fed'))}}else if(Date.now()-S.fedAt>=MILKMS){S.milk+=S.cows*2;S.fedAt=null;toast(t('milked'))}}
  else if(n.t==='h'){if(!S.eggAt){if(S.grain<S.hens)toast(t('noGrain'));else{S.grain-=S.hens;S.eggAt=Date.now();toast(t('fedh'))}}else if(Date.now()-S.eggAt>=EGGMS){S.eggs+=S.hens;S.eggAt=null;toast(t('gotegg'))}}
  else if(n.t==='f'){const need=Math.ceil(S.fish/2);if(!S.fishAt){if(S.fishFeed<need)toast(t('noFFeed'));else{S.fishFeed-=need;S.fishAt=Date.now();toast(t('fedf'))}}else if(Date.now()-S.fishAt>=FISHMS){S.catchN+=S.fish;S.fishAt=null;toast(t('gotfish'))}}
  else if(n.t==='w'){if(S.water>=S.cap)toast(t('full'));else{S.water=S.cap;toast(t('filled'))}}
  else if(n.t==='m'){mk();$('mk').classList.remove('hidden')}
  else{
    const p=S.plots[n.i];
    if(!p)return toast(t('needPlow'));
    if(!p.c){if(S.seeds[S.sel]<1)return toast(t('noSeed'));S.seeds[S.sel]--;p.c=S.sel;toast(t('planted'))}
    else if(!p.w){if(S.water<1)return toast(t('needWater'));S.water--;p.w=Date.now();toast(t('watered'))}
    else if(prog(p)>=1){S.crops[p.c]++;S.plots[n.i]=null;toast(t('harvested'))}
  }
  save();hud();
}

  else if(a==='buy'){if(!spend(CROPS[k].seed))return;S.seeds[k]++;toast(t('bought'))}
  else if(a==='sellmilk'){if(!S.milk)return;S.coins+=S.milk*milkP();S.milk=0;toast(t('sold'))}
  else if(a==='hay'){if(!spend(6))return;S.hay++;toast(t('bought'))}
  else if(a==='selleggs'){if(!S.eggs)return;S.coins+=S.eggs*eggP();S.eggs=0;toast(t('sold'))}
  else if(a==='grain'){if(!spend(3))return;S.grain++;toast(t('bought'))}
  else if(a==='hen'){if(S.hens>=6||!spend(henP()))return;S.hens++;toast(t('bought'))}
  else if(a==='sellfish'){if(!S.catchN)return;S.coins+=S.catchN*fishP();S.catchN=0;toast(t('sold'))}
  else if(a==='ffeed'){if(!spend(4))return;S.fishFeed++;toast(t('bought'))}
  else if(a==='fry'){if(S.fish>=8||!spend(fryP()))return;S.fish++;toast(t('bought'))}
  else if(a==='cow'){if(S.cows>=3||!spend(cowP()))return;S.cows++;toast(t('bought'))}
  else if(a==='cap'){if(!spend(bc()))return;S.cap+=3;toast(t('bought'))}

};

function applyLang(){
  document.documentElement.lang=lang;document.title=t('title')+' · '+(lang==='en'?'দেশি কৃষি':'Deshi Krishi');
  $('title').textContent=t('title');
  $('st-t').textContent=t('title');$('st-go').textContent='▶ '+t('start');$('st-gt').textContent=t('guide');
  $('st-gl').innerHTML=['g1','g2','g3','g4','g5','g6'].map(k=>`<li>${t(k)}</li>`).join('');
  LB.forEach(l=>l.el.textContent=l.e+' '+t(l.k));
  $('le').style.cssText=lang==='en'?'text-decoration:underline;color:var(--accent)':'';
  $('lb').style.cssText=lang==='bn'?'text-decoration:underline;color:var(--accent)':'';
  hud();if(!$('mk').classList.contains('hidden'))mk();
}
$('lang').onclick=()=>{lang=lang==='en'?'bn':'en';applyLang()};

/* ---------- Loop ---------- */
let lastS='';
function actUI(){
  const n=near();let s,en=true;
  if(!n){s=t('walk');en=false}else if(n.t==='d')s='🚶 '+t('getoff');else if(n.t==='t')s='🚜 '+t('drive');
  else if(n.t==='c'){if(!S.fedAt)s='🌿 '+t('feed')+' ('+fmt(S.cows)+')';else{const pr=Math.min(1,(Date.now()-S.fedAt)/MILKMS);if(pr>=1)s='🥛 '+t('getmilk');else{s='⏳ '+t('milking')+' '+fmt(Math.floor(pr*100))+'%';en=false}}}
  else if(n.t==='h'){if(!S.eggAt)s='🌾 '+t('feedhens')+' ('+fmt(S.hens)+')';else{const pr=Math.min(1,(Date.now()-S.eggAt)/EGGMS);if(pr>=1)s='🥚 '+t('getegg');else{s='⏳ '+t('laying')+' '+fmt(Math.floor(pr*100))+'%';en=false}}}
  else if(n.t==='f'){if(!S.fishAt)s='🐟 '+t('feedfish')+' ('+fmt(Math.ceil(S.fish/2))+')';else{const pr=Math.min(1,(Date.now()-S.fishAt)/FISHMS);if(pr>=1)s='🎣 '+t('netfish');else{s='⏳ '+t('growfish')+' '+fmt(Math.floor(pr*100))+'%';en=false}}}
  else if(n.t==='w')s='💧 '+t('collect');
  else if(n.t==='m')s='🏪 '+t('open');
  else{const p=S.plots[n.i];
    if(!p){s='🚜 '+t('needPlow');en=false}
    else if(!p.c)s=CROPS[S.sel].e+' '+t('plant')+' '+cn(S.sel);
    else if(!p.w)s='💧 '+t('water');
    else{const pr=prog(p);if(pr>=1)s='🧺 '+t('harvest');else{s='⏳ '+t('growing')+' '+fmt(Math.floor(pr*100))+'%';en=false}}}
  if(s!==lastS){$('act').textContent=s;lastS=s}
  $('act').disabled=!en;
}
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();let tt=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);tt+=dt;
  let ix=(K.ArrowRight||K.d?1:0)-(K.ArrowLeft||K.a?1:0)+J.x,iz=(K.ArrowDown||K.s?1:0)-(K.ArrowUp||K.w?1:0)+J.y;
  const il=Math.hypot(ix,iz);
  if(il>.08){tgt=null;if(il>1){ix/=il;iz/=il}}
  else if(tgt){const dx=tgt.x-P.position.x,dz=tgt.z-P.position.z,d=Math.hypot(dx,dz);if(d<.3){tgt=null;ix=iz=0}else{ix=dx/d;iz=dz/d}}
  else ix=iz=0;
  const mv=ix||iz;
  if(mv){
    P.position.x=Math.max(-40,Math.min(40,P.position.x+ix*(driving?9:6)*dt));
    P.position.z=Math.max(-40,Math.min(40,P.position.z+iz*(driving?9:6)*dt));
    P.rotation.y=Math.atan2(ix,iz);P.position.y=Math.abs(Math.sin(tt*12))*.12;
  }else P.position.y=0;
  const sn=seasonNow();if(sn!==season){season=sn;applySeason(true)}
  if(driving){TR.position.set(P.position.x,P.position.y,P.position.z);TR.rotation.y=P.rotation.y;
    for(let i=0;i<S.plots.length;i++)if(S.plots[i]===null&&Math.hypot(P.position.x-PP[i].x,P.position.z-PP[i].z)<1.9){S.plots[i]={c:null,w:null};toast(t('plowed'));save()}}
  if(season==='rain'){S.plots.forEach(p=>{if(p&&p.c&&!p.w)p.w=Date.now()});for(let i=1;i<RN*3;i+=3){rp[i]-=22*dt;if(rp[i]<0)rp[i]+=18}rg.attributes.position.needsUpdate=true;rain.position.set(P.position.x,0,P.position.z)}
  const st=SEA[season].e+' '+t(season)+' · '+fmt(Math.ceil((SLEN-Date.now()%SLEN)/1000))+(lang==='bn'?' সে.':'s');if($('sea').textContent!==st)$('sea').textContent=st;
  cam.position.lerp(new THREE.Vector3(P.position.x,9,P.position.z+11),.08);
  cam.lookAt(P.position.x,1,P.position.z);
  for(let i=0;i<9;i++)vis(i);
  HENS.forEach((c,i)=>{c.visible=i<S.hens;const u=c.userData,dx=u.tx-c.position.x,dz=u.tz-c.position.z,d=Math.hypot(dx,dz);if(d<.15){c.position.y=0;if(Math.random()<.03){u.tx=HF.x-2.6+Math.random()*5.2;u.tz=HF.z-2+Math.random()*4}}else{c.position.x+=dx/d*1.2*dt;c.position.z+=dz/d*1.2*dt;c.rotation.y=Math.atan2(dx,dz);c.position.y=Math.abs(Math.sin(tt*10+i))*.05}});
  FISH.forEach((c,i)=>{c.visible=i<S.fish;const u=c.userData,dx=u.tx-c.position.x,dz=u.tz-c.position.z,d=Math.hypot(dx,dz);if(d<.2){u.tx=FF.x-3+Math.random()*6;u.tz=FF.z-1.8+Math.random()*3.6}else{c.position.x+=dx/d*1.1*dt;c.position.z+=dz/d*1.1*dt;c.rotation.y=Math.atan2(dx,dz)}});
  SK.rotation.y=Math.sin(tt*.7)*.35;SK2.rotation.y=Math.sin(tt*.6+1)*.35;SK3.rotation.y=Math.sin(tt*.5+2)*.35;
  COWS.forEach((c,i)=>{c.visible=i<S.cows;const u=c.userData,dx=u.tx-c.position.x,dz=u.tz-c.position.z,d=Math.hypot(dx,dz);if(d<.3){if(Math.random()<.02){u.tx=CF.x-4+Math.random()*8;u.tz=CF.z-2.4+Math.random()*4.8}}else{c.position.x+=dx/d*.8*dt;c.position.z+=dz/d*.8*dt;c.rotation.y=Math.atan2(dx,dz)}});
  LB[3].x=TR.position.x;LB[3].z=TR.position.z;LB.forEach(l=>{tv.set(l.x,l.h,l.z).project(cam);l.el.style.opacity=tv.z>1?0:1;l.el.style.left=(tv.x*.5+.5)*innerWidth+'px';l.el.style.top=(-tv.y*.5+.5)*innerHeight+'px'});
  actUI();
  R.render(sc,cam);
}
applySeason(false);applyLang();hud();loop();
let started=false;
$('lang2').onclick=()=>$('lang').click();
$('st-go').onclick=()=>{started=true;const s=$('start');s.style.opacity=0;s.style.pointerEvents='none';setTimeout(()=>s.style.display='none',400);toast(t('hint'))};
setInterval(save,10000);
</script>
